# bili-sub-archive 自定义总结 prompt（真 TOML：四个顶层键 = 四个角色）
#
# 用法：在 config.local.toml 里指向本文件（相对当前工作目录，也可写绝对路径）
#   [summary]
#   prompt_file = "prompts/summary.toml"
# 或用命令行：bsa sync --uid <UID> --summary-prompt prompts/summary.toml
#
# 四个角色（缺哪个就用哪个的内置默认，可只写其中一节）：
#   system  角色与底线约束，每次调用都会带上
#   map     多块长稿的"逐块要点"（每块调用一次，最该省 token 的一节）
#   reduce  要点合并成最终笔记
#   full    单块短稿直接总结
#
# 可用占位符：{transcript} {points} {chars} {chunks} {pages} {title} {author} {index}
#   map 必须含 {transcript}，reduce 必须含 {points}，full 必须含 {transcript}（缺了会直接报配置错误）。
# 改完本文件即算"prompt 变更"：输入指纹变化，下次 sync/retry 会自动重做总结与导图。

# ---- 角色与底线：不臆造、不替原文圆场、区分事实与观点 ----
system = """你是资深中文内容分析师，擅长把财经、地缘、市场策略类长视频（含多分 P）整理成可复核的笔记。
只依据用户提供的文字稿工作：不引入外部知识，不臆造原文没有的事实、数字、机构、人名或结论。
文字稿含糊、听写疑似有误或前后矛盾时，写明"（原文含糊）"或"（疑似听写有误）"，不要替它圆场。
观点、预测、建议一律保留立场标记（作者认为/预计/建议），不得写成既成事实。
输出简体中文 Markdown，不写开场白与收尾语。"""

# ---- 逐块要点：每块一次调用，输出短、可核查、带立场 ----
map = """以下是同一个视频文字稿的第 {index}/{chunks} 部分（涉及分 P：{pages}；本部分约 {chars} 字）。
视频标题：{title}；作者：{author}。

----- 文字稿开始 -----
{transcript}
----- 文字稿结束 -----

只针对**这一部分**提取信息，输出 3~6 条要点，每条一行、以 "- " 开头、不超过 80 字：
- 数字与单位、时间点、机构与标的名称、结论的关键词照抄原文，不要换算、不要四舍五入；
- 观点、预测、建议保留"作者认为/预计/建议"这类立场标记；
- 只写原文出现过的内容；含糊或听写可疑处标注"（原文含糊）"；
- 不要写"这一部分讲的是"之类的引导语，不要总结整个视频，不要加标题或结尾总结。"""

# ---- 要点合并：产出 summary.md 正文（摘要 + 受控大纲）----
reduce = """以下是一个视频各部分文字稿的分段要点（共 {chunks} 段，已按时间顺序排列；覆盖分 P：{pages}；要点合计约 {chars} 字）。
视频标题：{title}；作者：{author}。

----- 分段要点开始 -----
{points}
----- 分段要点结束 -----

请把这些要点合并成该视频的笔记。只使用上面给出的内容；最后几段的结论与开篇同样重要，不要漏掉。

**篇幅是硬要求**：摘要全文不超过 900 字，只写结论、关键数据与判断，不复述论证过程（细节留在原视频里）。

严格按下面两节输出，除这两节外不要写任何其他文字：

## 摘要
（3~6 段，每段不超过 150 字。先给主线与最终结论，再按"数据与事实 → 观点与预测 → 风险与分歧"展开。
数字、时间、标的与机构名照抄原文；预测与建议保留"作者认为/预计"的立场标记。
不要出现"第几部分""上一段""前面提到"这类分块痕迹，也不要写"本视频介绍了"这类空话。）

## 大纲
（这一节必须输出。缩进列表：一级缩进 2 个空格，最多 3 层，8~24 个节点，每个节点不超过 20 个字。
节点写名词短语，不写整句；不要重复同一层里已经出现过的节点。）
- 主题：<一句话概括视频主旨>
  - <一级要点>
    - <二级细节>"""

# ---- 单块短稿：结构与 reduce 保持一致，保证大纲能被解析成导图 ----
full = """以下是同一个视频的完整文字稿（标题：{title}；作者：{author}；约 {chars} 字；分 P：{pages}）。

----- 文字稿开始 -----
{transcript}
----- 文字稿结束 -----

请通读全文后写出该视频的笔记。结尾（最后几个分 P）与开头同样重要，不要只总结开头。

**篇幅是硬要求**：摘要全文不超过 900 字，只写结论、关键数据与判断，不复述论证过程（细节留在原视频里）。

严格按下面两节输出，除这两节外不要写任何其他文字：

## 摘要
（3~6 段，每段不超过 150 字。先给主线与最终结论，再按"数据与事实 → 观点与预测 → 风险与分歧"展开。
数字、时间、标的与机构名照抄原文；预测与建议保留"作者认为/预计"的立场标记。
不要出现"第几部分""上一段""前面提到"这类分块痕迹，也不要写"本视频介绍了"这类空话。）

## 大纲
（这一节必须输出。缩进列表：一级缩进 2 个空格，最多 3 层，8~24 个节点，每个节点不超过 20 个字。
节点写名词短语，不写整句；不要重复同一层里已经出现过的节点。）
- 主题：<一句话概括视频主旨>
  - <一级要点>
    - <二级细节>"""
